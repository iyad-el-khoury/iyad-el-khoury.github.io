title: "Iyad El Khoury's homepage"
author:
  name: "Iyad El Khoury"
  email: iyad.e.k2005@gmail.com
description: >
  Welcome to my personal website! Here you can find informations about
  myself, blogs discussing my current interests and some contact details / other socials.

url: "https://iyad-el-khoury.github.io"
remote_theme: jekyll/minima@d4d779a
permalink: "/blog/:year/:month/:day/:title/"
markdown: kramdown

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-remote-theme

minima:
  skin: solarized-light
  date_format: "%b-%d-%Y"
  hide_site_feed_link: false
  social_links:
    - title: GitHub
      icon: github
      url: "https://github.com/iyad-el-khoury"
    - title: LinkedIn
      icon: linkedin
      url: "https://linkedin.com/in/iyad-el-khoury-ba7a43373"

# Pages shown in the top navigation bar, in this order.
# about.md and index.md are excluded automatically by minima's default logic,
# so we list what should appear explicitly.
header_pages:
  - about.md
  - projects.md
# Files/folders Jekyll should not try to process.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
