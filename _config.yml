# _config.yml
# ------------------------------------------------------------------
# This file holds SITE-WIDE settings. Anywhere in a template you can
# write {{ site.title }} and Jekyll will drop in the value below.
# Whenever you edit this file, you need to restart `jekyll serve`
# (it's the one file Jekyll doesn't "hot reload").
# ------------------------------------------------------------------

theme: minima
minima:
  skin: classic          # or: dark, solarized-light, solarized-dark
  social_links:
    - { platform: github, user_url: "https://github.com/iyad-el-khoury" }
    - { platform: linkedin, user_url: "https://linkedin.com/in/iyad-el-khoury-ba7a43373" }
title: "Iyad El Khoury's homepage"
author: "Iyad El Khoury"
description: "Welcome to my website, I am currently a student at l'École Polytechnique passionate for mathematics, computer science and the many links between them."
url: "https://iyad-el-khoury.github.io"

# Where blog posts live and what their URLs look like.
# :year/:month/:day/:title -> /blog/2026/07/14/my-post-title/
permalink: "/blog/:year/:month/:day/:title/"

# Markdown & build settings
markdown: kramdown
plugins:
  - jekyll-feed      # generates an RSS feed at /feed.xml automatically
  - jekyll-sitemap   # generates a sitemap.xml for search engines
  - jekyll-seo-tag 